# Production environment - promoted by the Jenkins "Release" stage.
name: fintrack-prod
services:
  api:
    image: ${IMAGE_REPO:-localhost:5000/fintrack-api}:${IMAGE_TAG:?IMAGE_TAG is required}
    container_name: fintrack-prod
    env_file: .env.production
    environment:
      NODE_ENV: production
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      CHAOS_TOKEN: ${CHAOS_TOKEN:?CHAOS_TOKEN is required}
    ports:
      - "3000:3000"
    restart: always
    networks: [devops-net]
    labels:
      com.fintrack.environment: production
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 512M }

networks:
  devops-net:
    external: true
