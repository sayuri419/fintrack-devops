global:
  scrape_interval: 10s
  evaluation_interval: 10s
  external_labels:
    project: fintrack

rule_files:
  - /etc/prometheus/alert.rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: fintrack-prod
    metrics_path: /metrics
    static_configs:
      - targets: ["fintrack-prod:3000"]
        labels: { environment: production }

  - job_name: fintrack-staging
    metrics_path: /metrics
    static_configs:
      - targets: ["fintrack-staging:3000"]
        labels: { environment: staging }

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
