# SonarQube configuration for the Code Quality stage
sonar.projectKey=fintrack-api
sonar.projectName=FinTrack API
sonar.sourceEncoding=UTF-8

sonar.sources=src
sonar.tests=tests
sonar.test.inclusions=tests/**/*.test.js

# Exclusions: generated output and the process entry point (only wiring, no logic)
sonar.exclusions=coverage/**,reports/**,node_modules/**
sonar.coverage.exclusions=src/server.js,scripts/**
# Validation schemas are declarative and naturally look repetitive
sonar.cpd.exclusions=src/utils/validators.js

# Feed Jest coverage and ESLint findings into SonarQube
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.eslint.reportPaths=reports/eslint-report.json

# Ask the scanner to wait for the quality gate result
sonar.qualitygate.wait=false
